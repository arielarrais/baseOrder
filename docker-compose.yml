services:
  kafka:
    image: apache/kafka:latest
    container_name: baseorder-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: baseorder-kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: src/OrderAccumulator/OrderAccumulator.Worker/Dockerfile
    container_name: baseorder-worker
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SQLITE_DB_PATH: /data/baseorder.db
    volumes:
      - order-data:/data
    depends_on:
      kafka:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: src/OrderGenerator/OrderGenerator.Web/Dockerfile
    container_name: baseorder-web
    ports:
      - "5000:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SQLITE_DB_PATH: /data/baseorder.db
    volumes:
      - order-data:/data
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  order-data:
